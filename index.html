<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>MIFI · Acceso restringido</title>
<style>
  :root{--bg:#0f1b2d;--card:#ffffff;--ink:#14213d;--muted:#6b7280;--accent:#1f4e8c;--err:#b42318;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;
       background:radial-gradient(circle at 30% 20%,#1d3557 0%,var(--bg) 70%);
       font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;color:var(--ink)}
  .card{width:100%;max-width:380px;background:var(--card);border-radius:14px;padding:36px 30px;
        box-shadow:0 20px 50px rgba(0,0,0,.35)}
  .lock{width:52px;height:52px;border-radius:50%;background:#eef3fb;display:flex;align-items:center;
        justify-content:center;margin:0 auto 18px}
  h1{font-size:20px;text-align:center;font-weight:650}
  p.sub{font-size:13.5px;color:var(--muted);text-align:center;margin:6px 0 24px}
  label{font-size:12.5px;font-weight:600;display:block;margin-bottom:6px}
  input{width:100%;padding:12px 14px;border:1px solid #d1d5db;border-radius:8px;font-size:15px;outline:none}
  input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(31,78,140,.15)}
  button{width:100%;margin-top:16px;padding:12px;border:0;border-radius:8px;background:var(--accent);
         color:#fff;font-size:15px;font-weight:600;cursor:pointer}
  button:hover{background:#173d6e} button:disabled{opacity:.6;cursor:wait}
  .err{color:var(--err);font-size:13px;text-align:center;min-height:18px;margin-top:12px}
  .foot{font-size:11px;color:var(--muted);text-align:center;margin-top:20px}
  .shake{animation:sh .35s}
  @keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
</style>
</head>

  </div>
  <h1>Acceso restringido</h1>
  <p class="sub">Contenido confidencial. Ingrese la contraseña para continuar.</p>
  <label for="pw">Contraseña</label>
  <input id="pw" type="password" autofocus required>
  <button id="btn" type="submit">Acceder</button>
  <div class="err" id="err" role="alert"></div>

</form>

  function b(s){var r=atob(s),u=new Uint8Array(r.length);for(var i=0;i<r.length;i++)u[i]=r.charCodeAt(i);return u;}
  var f=document.getElementById('f'),pw=document.getElementById('pw'),
      btn=document.getElementById('btn'),err=document.getElementById('err');
  if(!window.crypto||!crypto.subtle){err.textContent='Navegador no compatible (se requiere HTTPS).';btn.disabled=true;return;}
  f.addEventListener('submit',async function(e){
    e.preventDefault(); err.textContent=''; btn.disabled=true; btn.textContent='Verificando…';
    try{
      var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw.value),'PBKDF2',false,['deriveKey']);
      var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(SALT),iterations:ITER,hash:'SHA-256'},

      var plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b(IV)},key,b(DATA));
      var html=new TextDecoder('utf-8').decode(plain);
      document.open(); document.write(html); document.close();
    }catch(x){
      err.textContent='Contraseña incorrecta'; pw.value=''; pw.focus();
      f.classList.remove('shake'); void f.offsetWidth; f.classList.add('shake');
      btn.disabled=false; btn.textContent='Acceder';
    }
  });
